# Nexa full-ERP run config (app module = nexa_addons).
# Paths are relative to this file unless absolute.

[options]

# Database
db_host = localhost
db_port = 5432
db_user = postgres
db_password = postgres
db_name = nexa
db_sslmode = disable

# HTTP
http_port = 8090
dev_mode = true

# Setup wizard (local dev)
setup_localhost_only = true
setup_token =

# Addons: core engine addons + this repo's platform/custom addons
addons_path = ../nexa/addons, .

# Engine home (assets/templates live in the nexa core repo)
nexa_home = ../nexa

# Logging
log_enabled = true
log_stdout = true
log_timezone = Local
log_rolling = false

rate_limit_rpm = 0
